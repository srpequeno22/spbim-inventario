/* ===================== TOKENS ===================== */
:root{--bg:#0c0d10;--s1:#14161b;--s2:#1b1e25;--ln:#262a33;--lnh:#3a4050;--tx:#e8eaf0;--mu:#8b92a3;--ac:#8b3fe0;--ac2:#a78bfa;--ok:#34d399;--er:#f87171;--wa:#fbbf24;--in:#60a5fa;
--g:linear-gradient(135deg,#f0643c,#8b3fe0 55%,#3f5cf2);--glass:#14161bcc;--card:#14161bcc;--th:#171a20;--sh:#0008;color-scheme:dark}
[data-theme=light]{--bg:#f4f5f9;--s1:#fff;--s2:#eef0f5;--ln:#dfe2ea;--lnh:#c3c8d4;--tx:#161922;--mu:#5d6577;--ac2:#7c3aed;--glass:#fff;--card:#ffffffd9;--th:#f7f8fb;--sh:#0002;color-scheme:light}

/* ===================== BASE ===================== */
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Sora,system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hide{display:none!important}

body:before{top:0;bottom:-240px;opacity:.22;animation:bgu 40s linear infinite}
body:after{top:-240px;bottom:0;background-position:100px 0;opacity:.15;animation:bgd 55s linear infinite}
@keyframes bgu{to{transform:translateY(-240px)}}
@keyframes bgd{to{transform:translateY(240px)}}
[data-theme=light] body:before,[data-theme=light] body:after{display:none}
#auth,#app{position:relative;z-index:1}

/* ===================== CONTROLES ===================== */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ln);background:var(--s2);border-radius:9px;padding:8px 14px;white-space:nowrap;transition:border-color .15s,background .15s,transform .15s,filter .15s}
.btn:hover{border-color:var(--lnh);transform:translateY(-1px)}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.p{background:var(--g);border-color:transparent;font-weight:600;color:#fff}
.btn.p:hover{filter:brightness(1.15)}
.btn.dz{background:var(--er);border-color:var(--er);font-weight:600;color:#fff}
.btn.i{padding:7px}
.btn.d:hover{border-color:var(--er);color:var(--er)}
.btn.on{border-color:var(--ac);background:#8b3fe01f}
.btn.load:after{content:"";width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{rotate:360deg}}
input,select,textarea{background:var(--s1);border:1px solid var(--ln);border-radius:9px;padding:9px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #8b3fe022;outline:0}
.lnk{background:0;border:0;color:var(--ac2);padding:0}.lnk:hover{text-decoration:underline}
.fld{margin-bottom:14px;position:relative}
.fld label{display:block;font-size:12px;color:var(--mu);margin-bottom:5px;transition:color .15s}
.fld:focus-within label{color:var(--ac2)}
.fld .eye{position:absolute;right:6px;top:25px;border:0;background:0;color:var(--mu);padding:6px}
.fld.bad input{border-color:var(--er)}
.err{color:var(--er);font-size:12px;margin-top:4px}
.msg{padding:10px 12px;border-radius:9px;margin-bottom:14px;font-size:13px}.msg.e{background:#f871711a;color:var(--er)}.msg.o{background:#34d3991a;color:var(--ok)}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:13px;cursor:pointer}.chk input{width:auto}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.hint{color:var(--mu);font-size:12px;margin:10px 0 0}

/* ===================== LOGIN ===================== */
#auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{position:relative;overflow:hidden;padding:56px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(900px 500px at 20% 110%,#8b3fe024,transparent);border-right:1px solid var(--ln)}
[data-theme=light] .hero{background:radial-gradient(900px 500px at 20% 110%,#8b3fe01a,transparent)}
.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:44px 44px;opacity:.35;-webkit-mask:linear-gradient(#000,transparent 85%);mask:linear-gradient(#000,transparent 85%)}
.hero:after{content:"";position:absolute;left:0;right:0;top:0;height:120px;background:linear-gradient(transparent,#8b3fe033,transparent);animation:scan 7s linear infinite;will-change:transform}
@keyframes scan{from{transform:translateY(-120px)}to{transform:translateY(100vh)}}
.hero>*{position:relative}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.lm{height:32px;width:auto;filter:drop-shadow(0 0 14px #8b3fe055)}
.hero h1{font-size:38px;line-height:1.15;margin:0 0 14px;max-width:440px;letter-spacing:-.02em}
.hero p{color:var(--mu);max-width:400px;margin:0}
.nums{display:flex;gap:36px}.nums b{display:block;font-size:30px;letter-spacing:-.02em}.nums span{color:var(--mu);font-size:12px}
.nums b,.tile b{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.formside{display:grid;place-items:center;padding:28px}
.card{position:relative;width:100%;max-width:380px;background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--ln);border-radius:16px;padding:30px;box-shadow:0 20px 60px var(--sh)}
.card:before{content:"";position:absolute;left:24px;right:24px;top:-1px;height:2px;border-radius:2px;background:var(--g)}
.card h2{margin:0 0 4px;font-size:22px}.card .sub{color:var(--mu);margin:0 0 22px}
.card .btn.p{width:100%;justify-content:center;padding:11px}
.row{display:flex;justify-content:space-between;margin-top:16px;font-size:13px;color:var(--mu)}
.pane{animation:in .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}}

/* ===================== LAYOUT ===================== */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;transition:grid-template-columns .25s}
#app.col{grid-template-columns:68px 1fr}
aside{position:sticky;top:0;height:100vh;background:var(--s1);border-right:1px solid var(--ln);padding:16px 12px;display:flex;flex-direction:column;gap:4px;z-index:5}
aside .logo{padding:4px 6px 18px}
.nv{position:relative;display:flex;align-items:center;gap:12px;padding:10px;border-radius:9px;border:0;background:0;color:var(--mu);width:100%;text-align:left;white-space:nowrap;transition:background .15s,color .15s}
.nv:hover{background:var(--s2);color:var(--tx)}
.nv.on{background:linear-gradient(90deg,#8b3fe033,#3f5cf20d);color:var(--tx)}
.nv.on:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--g)}
.nv svg{transition:transform .25s}.nv:hover svg{transform:scale(1.18) rotate(-6deg)}.nv.on svg{color:var(--ac2)}
.nv:after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;transform:translate(-6px,-50%);background:var(--s2);color:var(--tx);border:1px solid var(--ln);padding:5px 10px;border-radius:8px;font-size:12px;white-space:nowrap;box-shadow:0 8px 24px #0006;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .15s,transform .15s;z-index:30}
.nv:hover:after,.nv:focus-visible:after{opacity:1;visibility:visible;transform:translate(0,-50%);transition-delay:.4s}
.nv:not([data-tip]):after{display:none}
.nb{margin-left:auto;font-style:normal;font-size:11px;min-width:20px;text-align:center;padding:1px 6px;border-radius:10px;background:#f8717126;color:var(--er)}
.col .nv span,.col .logo span,.col .who,.col .nb{display:none}
.sp{flex:1}
.usr{display:flex;align-items:center;gap:10px;padding:8px 4px;border-top:1px solid var(--ln);margin-top:6px}
.col .usr{justify-content:center;padding:8px 0}
.av{width:36px;height:36px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;overflow:hidden;flex:none;border:0;padding:0;transition:box-shadow .2s}
.av:hover{box-shadow:0 0 0 3px #8b3fe055}.av img{width:100%;height:100%;object-fit:cover}
.who{color:var(--mu);font-size:12px;line-height:1.25;min-width:0}
.who b{display:block;color:var(--tx);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who small{font-size:11px}
main{padding:68px 32px 28px;min-width:0;max-width:1400px}
#mb,#ov{display:none}

/* barra superior */
#tb2{position:fixed;top:14px;right:24px;z-index:4;display:flex;gap:6px;padding:5px;border-radius:12px;background:var(--s1);border:1px solid var(--ln);box-shadow:0 6px 20px #0004}
#tb2 .btn{padding:7px 10px;background:transparent;border-color:transparent}#tb2 .btn:hover{background:var(--s2)}
kbd{font:11px Sora,sans-serif;border:1px solid var(--ln);border-radius:5px;padding:1px 6px;color:var(--mu);background:var(--s2)}
#bell{position:relative}
#bd{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--er);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;font-weight:700}
#np{position:fixed;top:64px;right:24px;width:min(340px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:12px;z-index:8;box-shadow:0 20px 50px #0007;animation:in .25s both}
#np h4{margin:4px 2px 8px;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.al{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:9px;margin-bottom:6px;font-size:13px;background:var(--s2);cursor:pointer;transition:transform .15s}
.al:hover{transform:translateX(2px)}.al svg{width:16px;height:16px;margin-top:2px}.al.er svg{color:var(--er)}.al.wa svg{color:var(--wa)}
.alp h3{display:flex;justify-content:space-between}

/* ===================== PÁGINAS ===================== */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.top h2{margin:0;font-size:22px;letter-spacing:-.01em}.top p{margin:2px 0 0;color:var(--mu)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.top .tools{margin:0}
.tools input{max-width:260px}.tools input.wd{max-width:340px}.tools select,.tools input[type=date]{width:auto}
.fresh>.pg>*{animation:in .5s cubic-bezier(.2,.8,.2,1) both}

<script>
'use strict';
/* =====================================================================

/* =====================================================================
   BANCO DE DADOS (via API própria)
   O navegador NÃO fala com o Supabase: ele chama /api/... no nosso
   servidor (Vercel), que confere o login e só então acessa o banco.
   Nenhuma chave do banco fica neste arquivo.
   Aberto direto do disco (file://), o site usa o modo antigo (só neste navegador).
   ===================================================================== */
const CLOUD_CFG=location.protocol!=='file:';
async function api(path,opt={}){
  const r=await fetch('/api/'+path,{method:opt.method||'GET',credentials:'same-origin',cache:'no-store',
    headers:opt.body!==undefined?{'Content-Type':'application/json'}:{},body:opt.body!==undefined?JSON.stringify(opt.body):undefined});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error((j&&j.erro)||('HTTP '+r.status));e.status=r.status;throw e}
  return j}
/* chave do localStorage -> linha da tabela "inventario" */
const SYNC={'bs2.items':'items','bs2.movs':'movs','bs2.per':'per','bs2.cmp':'cmp','bs2.acts':'acts','bs3.assets':'assets','bs3.loans':'loans','bs3.maint':'maint','bs3.trash':'trash','bs6.hw':'hw','bs.users':'users','bs2.low':'low'};
const KEYOF=Object.fromEntries(Object.entries(SYNC).map(([k,v])=>[v,k]));
const cloud={on:false,pend:{},sent:{},t:null,poll:null,ts:null,warned:false};
function cloudQueue(k,v){if(!cloud.on||!(k in SYNC))return;const s=JSON.stringify(v);if(cloud.sent[k]===s){delete cloud.pend[k];return}
  cloud.pend[k]=s;clearTimeout(cloud.t);cloud.t=setTimeout(cloudPush,700)}
async function cloudPush(){clearTimeout(cloud.t);if(!cloud.on)return;const p=cloud.pend;cloud.pend={};
  const rows=Object.entries(p).map(([k,s])=>({chave:SYNC[k],dados:JSON.parse(s)}));if(!rows.length)return;
  let error;try{await api('inventario',{method:'PUT',body:{linhas:rows}})}catch(e){error=e}
  if(error){console.error('API:',error);cloud.pend={...p,...cloud.pend};
    if(error.status===401)return cloudExpired();
    cloud.t=setTimeout(cloudPush,5000);
    if(!cloud.warned){cloud.warned=true;toast('Sem conexão com o banco de dados. As alterações serão enviadas quando a conexão voltar.')}return}
  if(cloud.warned){cloud.warned=false;toast('Conexão restabelecida. Alterações salvas.','ok')}
  for(const k in p)cloud.sent[k]=p[k]}
async function cloudPull(){const r=await api('inventario');cloud.ts=r.ts||null;
  const got={};r.linhas.forEach(x=>{const k=KEYOF[x.chave];if(k){got[k]=x.dados;cloud.sent[k]=JSON.stringify(x.dados)}});return got}
function cloudApply(got){
  for(const k in got){mem[k]=got[k];try{localStorage.setItem(k,JSON.stringify(got[k]))}catch(e){}}
  const A=k=>Array.isArray(got[k]);
  if(A('bs2.items'))items=got['bs2.items'];if(A('bs2.movs'))movs=got['bs2.movs'];if(A('bs2.per'))per=got['bs2.per'];if(A('bs2.cmp'))cmp=got['bs2.cmp'];if(A('bs2.acts'))acts=got['bs2.acts'];
  if(A('bs3.assets'))assets=got['bs3.assets'];if(A('bs3.loans'))loans=got['bs3.loans'];if(A('bs3.maint'))maint=got['bs3.maint'];if(A('bs3.trash'))trash=got['bs3.trash'];if(A('bs6.hw'))hw=got['bs6.hw'];
  lastS=ser();lastD=JSON.parse(lastS);lastA=acts[0]?acts[0].t:0;undoS=[]}
/* atualização automática: a cada 15 s pergunta à API o que mudou e redesenha a tela */
async function cloudPoll(){if(!cloud.on||document.hidden)return;
  let r;try{r=await api('inventario'+(cloud.ts?'?desde='+encodeURIComponent(cloud.ts):''))}catch(e){if(e.status===401)cloudExpired();return}
  if(!cloud.on)return;if(r.ts)cloud.ts=r.ts;let ch=false;
  for(const x of r.linhas){const k=KEYOF[x.chave];if(!k||cloud.pend[k])continue;
    const s=JSON.stringify(x.dados);if(cloud.sent[k]===s)continue;cloud.sent[k]=s;cloudApply({[k]:x.dados});ch=true}
  if(ch&&user){if(!document.querySelector('dialog[open]')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render();refreshBar()}}
function cloudLive(){if(!cloud.poll)cloud.poll=setInterval(cloudPoll,15000)}
function cloudStop(){cloud.on=false;clearTimeout(cloud.t);clearInterval(cloud.poll);cloud.poll=null}
/* sessão vencida: volta para o login sem perder o que ainda não foi enviado */
function cloudExpired(){if(!user)return;cloudStop();user=null;ls.set('bs.sess',null);kStop();closeDlg();
  $('#np').classList.add('hide');$('#app').classList.add('hide');$('#auth').classList.remove('hide');
  authUI('<p class="err">Sua sessão expirou. Entre novamente para continuar.</p>')}
async function cloudStart(s){
  const keep=cloud.pend;cloud.pend={};
  try{const got=await cloudPull();cloud.on=true;
    /* banco vazio (primeiro acesso): envia os dados que já estão neste navegador */
    if(Object.keys(got).length)cloudApply(got);else{save();ls.set('bs.users',users())}
    /* alterações feitas antes da sessão vencer: reaplica e envia */
    if(Object.keys(keep).length){const g={};for(const k in keep)g[k]=JSON.parse(keep[k]);cloudApply(g);Object.assign(cloud.pend,keep);cloudPush()}
    cloudLive()}
  catch(e){console.error(e);cloudStop();cloud.pend=keep;
    if(e.status===401)return authUI();
    api('logout',{method:'POST',body:{}}).catch(()=>{});
    return authUI('<p class="err">Não foi possível acessar o banco de dados. Verifique a internet e tente novamente.</p>')}
  const em=s.user.email.toLowerCase(),us=users();let u=us.find(x=>x.email===em);
  if(!u){const md=s.user.user_metadata||{};
    u={name:md.name||md.nome||em.split('@')[0],email:em,role:us.some(x=>String(x.email||'').includes('@'))?'Operador':'Administrador'};ls.set('bs.users',[...us,u])}
  enter(u)}
function cloudAuthUI(note){
  $('#ac').innerHTML=`<div class="pane"><h2>Entrar</h2><p class="sub">Use o e-mail e a senha cadastrados pelo administrador.</p>${note||''}<form id="fm" novalidate>
<div class="fld" id="f-email"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" maxlength="120"></div>
<div class="fld" id="f-pw"><label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password" maxlength="200"></div>
<button class="btn p" id="go" type="submit">Entrar</button></form></div>`;
  $('#fm').onsubmit=async e=>{e.preventDefault();$$('.bad').forEach(f=>f.classList.remove('bad'));$$('.err').forEach(x=>x.remove());
    const em=$('#email').value.trim(),pw=$('#pw').value;
    if(!em)return bad('email','Informe seu e-mail.');if(!pw)return bad('pw','Informe sua senha.');
    const b=$('#go');b.disabled=true;b.textContent='Entrando…';
    let s;try{s=await api('login',{method:'POST',body:{email:em,senha:pw}})}
    catch(err){b.disabled=false;b.textContent='Entrar';
      return bad('pw',err.status===401?'E-mail ou senha incorretos.':err.status===429?'Muitas tentativas. Aguarde alguns minutos.':'Não foi possível conectar ao servidor. Tente novamente.')}
    b.textContent='Carregando dados…';cloudStart(s)};
  setTimeout(()=>$('#email').focus(),50)}

const libs={};
function need(name,src,glob){return libs[name]||(libs[name]=new Promise((ok,no)=>{if(window[glob])return ok(window[glob]);const s=document.createElement('script');s.src=src;s.async=true;s.onload=()=>window[glob]?ok(window[glob]):no();s.onerror=()=>{delete libs[name];s.remove();no(new Error(name))};document.head.append(s)}))}

async function readSheet(f){const X=await XL(),wb=X.read(await f.arrayBuffer(),{type:'array'});return X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]])}

function track(){
  if(lastS===null||!user)return;const c=ser();if(c===lastS)return;
  const lb=acts[0]&&acts[0].t!==lastA?acts[0].a+' · '+acts[0].w:'Alteração';lastA=acts[0]?acts[0].t:0;
  if(!noTr){const C=COL();for(const k in K){const ids=new Set(C[k].map(y=>y.id));(lastD[k]||[]).forEach(x=>{if(!ids.has(x.id))trash.unshift({k,d:x,t:Date.now(),u:user.name})})}
    if(trash.length>200)trash.length=200;
    if(skipU)skipU=false;else{undoS.push({s:lastS,l:lb,t:Date.now()});if(undoS.length>25)undoS.shift()}}
  lastS=c;lastD=JSON.parse(c);
}
function save(){
  track();
  ls.set('bs2.items',items);ls.set('bs2.movs',movs);ls.set('bs2.per',per);ls.set('bs2.cmp',cmp);ls.set('bs2.acts',acts);
  ls.set('bs3.assets',assets);ls.set('bs3.loans',loans);ls.set('bs3.maint',maint);ls.set('bs3.trash',trash);ls.set('bs6.hw',hw);

}

function alerts(){const a=[];
  lowList().forEach(l=>a.push({k:l.q<=1?'er':'wa',t:`${l.c}: ${l.q} ${l.q===1?'unidade restante':'unidades restantes'}`,v:'low'}));
  const cd=sqty('Com defeito'),cm=sqty('Em manutenção'),pm=cmp.filter(c=>c.status==='Em manutenção').length;

  if(pm)a.push({k:'wa',t:`${pm} computador(es) em manutenção`,v:'man'});
  items.forEach(i=>{if(i.qty===0)a.push({k:'er',t:`${i.name} sem estoque`,v:'low'})});
  loans.filter(lateLoan).forEach(l=>a.push({k:'er',t:`Empréstimo atrasado: ${aC(l.aid)} com ${l.who}`,v:'loan'}));
  let ex=0;assets.forEach(s=>{const w=aW(s);if(w===null||s.status==='Baixado')return;if(w<0)ex++;else if(w<=30)a.push({k:'wa',t:`${s.code}: garantia vence em ${w} dia(s)`,v:'ast'})});

<div class="tools"><input id="s" type="search" placeholder="Pesquisar item ou categoria" value="${esc(q)}" aria-label="Pesquisar"><select id="fc" aria-label="Categoria">${opts(cats,fc,'Todas as categorias')}</select><select id="fs" aria-label="Status">${opts(STS,fsx,'Todos os status')}</select><label class="chk"><input type="checkbox" id="fl" ${flo?'checked':''}>Só estoque baixo</label><input type="file" id="fi" accept=".xlsx,.xls,.csv" class="hide"></div>
<div class="tw"><table><thead><tr>${th('name','Item')}${th('cat','Categoria')}${th('qty','Quantidade')}<th>Status</th><th><span class="hide">Ações</span></th></tr></thead><tbody id="tb"></tbody></table></div><div class="pgn" id="pgn"></div></div>`;

  $('#new').onclick=()=>form();$('#imp').onclick=()=>$('#fi').click();$('#fi').onchange=importF;$('#exp').onclick=()=>exp('inv');
  /* um único ouvinte para toda a tabela */
  const F=id=>items.find(i=>i.id===id),tb=$('#tb');
  tb.onclick=async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
    if(d.d)setQty(d.d,F(d.d).qty-1);else if(d.u)setQty(d.u,F(d.u).qty+1);else if(d.e)form(d.e);else if(d.h)hist(d.h);
    else if(d.x){const it=F(d.x);if(!await askDel(`Excluir "${it.name}"?`))return;if(it.qty)log(it,'Saída',-it.qty,0);act('Excluiu',it.name,`${it.qty} un. · ${it.cat}`,it.id);items=items.filter(i=>i!==it);save();invRows();toast('Item movido para a lixeira','ok',UNDO)}};
  tb.onchange=e=>{const t=e.target,d=t.dataset;if(d.q)setQty(d.q,t.value);else if(d.s){const it=F(d.s),o=it.status;it.status=t.value;act('Alterou status',it.name,`${o} → ${t.value}`,it.id);save();invRows();toast('Status atualizado','ok')}};

  $('#pgn').onchange=e=>{if(e.target.id==='ps'){pgS=+e.target.value;ls.set('bs2.ps',pgS);pgN=1;invRows()}};
  invRows()};
function invRows(){const tb=$('#tb');if(!tb||view!=='inv')return;const lw=lowSet(),t=q.toLowerCase(),dir=desc?-1:1;
  const l=items.filter(i=>(!t||(i.name+' '+i.cat).toLowerCase().includes(t))&&(!fc||i.cat===fc)&&(!fsx||i.status===fsx)&&(!flo||lw.has(i.cat)||i.qty===0));

    if(b.size>15e6)return toast('Arquivo muito grande (máx. 15 MB)');const fid=uid('f');await fput(fid,b);(a.files=a.files||[]).push({id:fid,name:f.name,kind,type:b.type||f.type||'application/octet-stream',size:b.size,t:Date.now()});act('Anexou arquivo',a.code,kind+' · '+f.name,id);save();aview(id);toast('Arquivo anexado','ok')}
  catch(e){toast('Não foi possível guardar o arquivo neste navegador')}}

async function lret(id){const l=loans.find(x=>x.id===id),a=aF(l.aid),r=await ask('Data da devolução',{ok:'Registrar devolução',input:{type:'date',value:tdy()}});if(!r)return false;

VIEWS.chk=m=>{m.innerHTML=`<div class="pg">${head('Conferência','Confirme equipamentos no local ou compare uma nova contagem.')}${tabs([['chk','Conferência presencial'],['cmp','Comparar contagem']],tabC,'kt')}<div id="kb"></div></div>`;
  $$('[data-kt]',m).forEach(b=>b.onclick=()=>{kStop();tabC=b.dataset.kt;VIEWS.chk(m)});tabC==='chk'?kChk():kCmp()};
function kStop(){clearInterval(camT);camT=null;if(camS){camS.getTracks().forEach(t=>t.stop());camS=null}}
const kSc=()=>assets.filter(a=>a.status!=='Baixado'&&(!chkS.sala||a.sala===chkS.sala)).sort((x,y)=>cmpS(x.code,y.code)),kSv=()=>ls.set('bs3.chk',chkS);
function kMark(a,on){if(on){chkS.found[a.id]=Date.now();chkS.start=chkS.start||Date.now()}else delete chkS.found[a.id];kSv();act(on?'Conferiu':'Desmarcou conferência',a.code,loc(a),a.id);save()}
function kHit(v){v=v.trim();const x=v.match(/#a=(.+)$/),id=x?decodeURIComponent(x[1]):null,a=assets.find(z=>z.id===id||z.code.toUpperCase()===v.toUpperCase());if(!a)return toast('Não encontrado no cadastro: '+v);
  kMark(a,true);toast(a.code+' encontrado'+(chkS.sala&&a.sala!==chkS.sala?' (cadastrado em: '+loc(a)+')':''),'ok');kList()}
function kChk(){$('#kb').innerHTML=`<div class="panel"><div class="tools" style="margin:0"><select id="ksa" aria-label="Sala">${opts(uniq('sala'),chkS.sala,'Todas as salas')}</select><input id="kin" class="wd" placeholder="Digite ou bipe o código (PC-001) e Enter" autocomplete="off" aria-label="Código do equipamento">${'BarcodeDetector' in window?`<button class="btn" id="kcam">${ic('scan')}Escanear QR</button>`:''}<button class="btn" id="kex">${ic('dn')}Exportar faltantes</button><button class="btn d" id="krs">Reiniciar</button></div><video id="cam" class="hide" playsinline muted></video></div><div id="kl" style="margin-top:14px"></div>`;
  $('#ksa').onchange=e=>{chkS.sala=e.target.value;kSv();kList()};
  $('#kin').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){kHit(e.target.value);e.target.value=''}};
  $('#kex').onclick=()=>xl(aRows(kSc().filter(a=>!chkS.found[a.id])),'conferencia-faltantes');
  $('#krs').onclick=async()=>{if(await askDel('Reiniciar a conferência? As marcações atuais serão apagadas.','Reiniciar')){chkS={found:{},sala:chkS.sala};kSv();kList()}};
  if($('#kcam'))$('#kcam').onclick=async()=>{const b=$('#kcam');if(camS){kStop();$('#cam').classList.add('hide');b.innerHTML=ic('scan')+'Escanear QR';return}
    try{camS=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#cam');v.srcObject=camS;v.classList.remove('hide');await v.play();b.innerHTML=ic('x')+'Parar câmera';
      const bd=new BarcodeDetector({formats:['qr_code']});let last='',lt2=0;
      camT=setInterval(async()=>{if(document.hidden)return;try{const r=await bd.detect(v);if(r[0]&&(r[0].rawValue!==last||Date.now()-lt2>3000)){last=r[0].rawValue;lt2=Date.now();kHit(last)}}catch(e){}},400)}
    catch(e){toast('Não foi possível abrir a câmera');kStop()}};
  kList();$('#kin').focus()}
function kList(){const sc=kSc(),f=sc.filter(a=>chkS.found[a.id]).length,kl=$('#kl');if(!kl)return;
  kl.innerHTML=`<div class="panel"><b>${f} de ${sc.length}</b> encontrados${chkS.start?` <small class="hint">· iniciada em ${fdt(chkS.start)}</small>`:''}<div class="prog"><i style="width:${sc.length?f/sc.length*100:0}%"></i></div></div><div class="tw" style="margin-top:14px"><table><thead><tr><th>Código</th><th>Equipamento</th><th>Local cadastrado</th><th>Situação</th><th></th></tr></thead><tbody>${[...sc].sort((x,y)=>(!!chkS.found[x.id])-(!!chkS.found[y.id])).map(a=>`<tr><td class="mono">${esc(a.code)}</td><td>${esc(a.name)}</td><td>${esc(loc(a))}</td><td>${chkS.found[a.id]?chip('Encontrado '+fdt(chkS.found[a.id]),'#34d399'):chip('Não conferido','#8b92a3')}</td><td class="act"><button class="btn" data-kf="${a.id}">${chkS.found[a.id]?'Desfazer':'Encontrado'}</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhum patrimônio neste filtro.</td></tr>'}</tbody></table></div>`;
  kl.onclick=e=>{const b=e.target.closest('[data-kf]');if(b){kMark(aF(b.dataset.kf),!chkS.found[b.dataset.kf]);kList()}}}
function kCmp(){const R=cmpR,c=t=>R.filter(r=>r.t===t).length,C={Faltando:'#f87171',Sobrando:'#fbbf24',Diferente:'#60a5fa'};
  $('#kb').innerHTML=`<div class="panel"><p class="hint" style="margin:0 0 12px">Importe uma planilha (.xlsx/.csv) com a nova contagem. Com a coluna <b>Código</b> compara o patrimônio; com <b>Nome</b>, <b>Categoria</b> e <b>Quantidade</b> compara o estoque.</p><div class="tools" style="margin:0"><button class="btn p" id="cim">${ic('up')}Importar contagem</button><input type="file" id="cfi" accept=".xlsx,.xls,.csv" class="hide">${R?`<button class="btn" id="cxe">${ic('dn')}Exportar diferenças</button>`:''}</div></div>${R?`<div class="tiles" style="margin-top:14px">${Object.keys(C).map(k=>`<div class="tile"><span>${k}</span><b>${c(k)}</b></div>`).join('')}</div>${R.length?`<div class="tw"><table><thead><tr><th>Situação</th><th>Item</th><th>Detalhe</th></tr></thead><tbody>${R.map(r=>`<tr><td>${chip(r.t,C[r.t])}</td><td>${esc(r.a)}</td><td>${esc(r.b)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="panel empty">Tudo confere com o cadastro.</div>'}`:''}`;
  $('#cim').onclick=()=>$('#cfi').click();if($('#cxe'))$('#cxe').onclick=()=>xl(R.map(r=>({Situação:r.t,Item:r.a,Detalhe:r.b})),'comparacao-inventario');
  $('#cfi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
    try{const rs=await readSheet(f),O=[];
      if(rs.some(r=>col(r,'código','codigo'))){const seen=new Set();
        rs.forEach(r=>{const cd=String(col(r,'código','codigo')).trim().toUpperCase();if(!cd)return;seen.add(cd);const a=assets.find(x=>x.code.toUpperCase()===cd);
          if(!a)O.push({t:'Sobrando',a:cd,b:String(col(r,'equipamento','nome'))||'Não está no cadastro'});else{const s=String(col(r,'sala')).trim();if(s&&s!==a.sala)O.push({t:'Diferente',a:cd,b:`Sala no cadastro: ${a.sala||'—'} · na contagem: ${s}`})}});
        assets.filter(a=>a.status!=='Baixado'&&!seen.has(a.code.toUpperCase())).forEach(a=>O.push({t:'Faltando',a:a.code,b:a.name+' · '+loc(a)}))}
      else{const mp=new Map();rs.forEach(r=>{const n=String(col(r,'nome','item')).trim(),ct=String(col(r,'categoria')).trim();if(!n)return;const k=(n+'|'+ct).toLowerCase();mp.set(k,{n,c:ct,q:(mp.get(k)?.q||0)+Math.max(0,Math.floor(+col(r,'quantidade','qtd'))||0)})});
        items.forEach(i=>{const k=(i.name+'|'+i.cat).toLowerCase(),x=mp.get(k);if(!x)O.push({t:'Faltando',a:i.name+' · '+i.cat,b:`Cadastro: ${i.qty} · não consta na contagem`});else{if(x.q!==i.qty)O.push({t:'Diferente',a:i.name+' · '+i.cat,b:`Cadastro: ${i.qty} · contagem: ${x.q}`});mp.delete(k)}});
        mp.forEach(x=>O.push({t:'Sobrando',a:x.n+' · '+x.c,b:`Contagem: ${x.q} · não está no cadastro`}))}
      cmpR=O;act('Comparou inventário',f.name,O.length+' divergências');save();kCmp()}
    catch(x){toast('Não foi possível ler o arquivo')}}}

  m.innerHTML=`<div class="pg">${head(T==='mov'?'Movimentações':'Registro de atividades',T==='mov'?`${movs.length} registros`:`${acts.length} registros`,`<button class="btn" id="ex">${ic('dn')}Exportar</button>`)}
${tabs([['mov','Entradas e saídas'],['act','Atividades']],T,'t')}
<div class="tools"><input id="s" type="search" placeholder="Pesquisar" value="${esc(mq)}" aria-label="Pesquisar"></div>
<div class="tw"><table><thead><tr>${T==='mov'?'<th>Data</th><th>Item</th><th>Categoria</th><th>Tipo</th><th>Variação</th><th>Saldo</th><th>Responsável</th>':'<th>Data</th><th>Responsável</th><th>Ação</th><th>Alvo</th><th>Detalhe</th>'}</tr></thead><tbody id="tb"></tbody></table></div><div class="pgn"><span id="mc"></span></div></div>`;
  $$('[data-t]',m).forEach(b=>b.onclick=()=>{movTab=b.dataset.t;mq='';VIEWS.mov(m)});
  $('#ex').onclick=()=>exp(T);
  const r=()=>{mq=$('#s').value;const t=mq.toLowerCase(),src=T==='mov'?movs.filter(v=>!t||[v.item,v.cat,v.u,v.type].join(' ').toLowerCase().includes(t)):acts.filter(a=>!t||[a.a,a.w,a.d,a.u].join(' ').toLowerCase().includes(t)),v=src.slice(0,200);
    $('#tb').innerHTML=v.map(x=>T==='mov'?`<tr><td>${fdt(x.t)}</td><td>${esc(x.item)}</td><td>${esc(x.cat)}</td><td>${chip(x.type,x.type==='Entrada'?'#34d399':'#f87171')}</td><td>${x.d>0?'+':''}${x.d}</td><td>${x.qty}</td><td>${esc(x.u)}</td></tr>`:`<tr><td>${fdt(x.t)}</td><td>${esc(x.u)}</td><td>${chip(x.a,actCol(x.a))}</td><td>${esc(x.w)}</td><td class="wrap">${esc(x.d||'—')}</td></tr>`).join('')||`<tr><td colspan="${T==='mov'?7:5}" class="empty">${T==='mov'?'Sem movimentações. Elas aparecem aqui quando uma quantidade muda.':'Sem atividades registradas ainda.'}</td></tr>`;
    $('#mc').textContent=`Mostrando ${v.length} de ${src.length}`};
  bindSearch($('#s'),r);r()};
async function xlAll(){try{const X=await XL(),wb=X.utils.book_new(),add=(n,r)=>X.utils.book_append_sheet(wb,X.utils.json_to_sheet(r.length?r:[{Aviso:'Sem registros'}]),n);
  add('Inventário',ROWS.inv());add('Computadores',ROWS.cmp());add('Periféricos',ROWS.per());add('Patrimônio',ROWS.ast());add('Empréstimos',ROWS.loan());add('Manutenções',ROWS.maint());add('Hardware',ROWS.hw());add('Movimentações',ROWS.mov());add('Atividades',ROWS.act());
  X.writeFile(wb,'spbim-relatorio.xlsx')}catch(e){toast('Não foi possível carregar o módulo de Excel. Verifique a conexão.')}}
function printReport(){const by=catAgg(),al=alerts(),now=new Date().toLocaleString('pt-BR');
  const sc=c=>STS.map(s=>items.filter(i=>i.cat===c&&i.status===s).reduce((a,i)=>a+i.qty,0));
  $('#prt').innerHTML=`<div class="ph"><img src="${LOGO}" alt=""><div><h1>Relatório de estoque</h1><p>SPBIM · ${now} · ${esc(user.name)}</p></div></div>
<div class="ps"><div><b>${items.length}</b>Itens cadastrados</div><div><b>${total()}</b>Peças em estoque</div><div><b>${cmp.length}</b>Computadores</div><div><b>${al.length}</b>Alertas</div></div>
<h2>Resumo por categoria</h2><table><thead><tr><th>Categoria</th><th>Itens</th><th>Peças</th>${STS.map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody>${by.map(b=>`<tr><td>${esc(b[0])}</td><td>${items.filter(i=>i.cat===b[0]).length}</td><td>${b[1]}</td>${sc(b[0]).map(n=>`<td>${n}</td>`).join('')}</tr>`).join('')}</tbody></table>
<h2>Alertas</h2>${al.length?`<table><tbody>${al.map(a=>`<tr><td>${esc(a.t)}</td></tr>`).join('')}</tbody></table>`:'<p>Nenhum alerta.</p>'}
<h2>Inventário completo</h2><table><thead><tr><th>Item</th><th>Categoria</th><th>Qtde</th><th>Status</th><th>Observações</th></tr></thead><tbody>${[...items].sort((a,b)=>cmpS(a.cat,b.cat)||cmpS(a.name,b.name)).map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.cat)}</td><td>${i.qty}</td><td>${esc(i.status)}</td><td>${esc(i.obs||'')}</td></tr>`).join('')}</tbody></table>`;
  act('Gerou relatório','PDF do estoque','');save();window.print()}
VIEWS.rel=m=>{const tq=total(),by=catAgg(),mx=Math.max(1,...by.map(b=>b[1])),mo=movs.filter(v=>v.t>Date.now()-30*864e5).length;
  m.innerHTML=`<div class="pg">${head('Relatórios','Gráficos e exportações.',`<button class="btn" id="rx">${ic('dn')}Excel completo</button><button class="btn p" id="rp">${ic('dn')}Gerar PDF</button>`)}
<div class="tiles">${tile('Peças em estoque',tq,'inv')}${tile('Itens cadastrados',items.length,'box')}${tile('Computadores',cmp.length,'pc')}${tile('Movimentações (30 dias)',mo,'mv')}</div>
<div class="grid2"><div class="panel"><h3>Peças por categoria</h3>${by.map(b=>`<div class="bar"><span>${esc(b[0])}</span><i style="width:${b[1]/mx*100}%"></i><em>${b[1]}</em></div>`).join('')}</div>
<div class="panel"><h3>Estado das peças</h3>${STS.map(s=>`<div class="bar"><span>${s}</span><i style="width:${tq?sqty(s)/tq*100:0}%;background:${SC[s]}"></i><em>${sqty(s)}</em></div>`).join('')}</div></div>
<div class="panel" style="margin-top:14px"><h3>Exportações rápidas</h3><div class="opt">${[['inv','Peças'],['cmp','Máquinas'],['per','Periféricos'],['ast','Patrimônio'],['loan','Empréstimos'],['maint','Manutenções'],['mov','Movimentações'],['act','Atividades']].map(x=>`<button class="btn" data-x="${x[0]}">${ic('dn')}${x[1]}</button>`).join('')}</div></div></div>`;
  $('#rx').onclick=xlAll;$('#rp').onclick=printReport;$$('[data-x]',m).forEach(b=>b.onclick=()=>exp(b.dataset.x));countUp(m)};

/* =====================================================================
   CONFIGURAÇÕES › GERAL, USUÁRIOS E LIXEIRA
   ===================================================================== */
VIEWS.usr=m=>{if(!isAd()){m.innerHTML=`<div class="pg">${head('Usuários','Controle de acesso')}<div class="panel empty">Apenas administradores podem gerenciar usuários.</div></div>`;return}
  const us=users();
  m.innerHTML=`<div class="pg">${head('Usuários',`${us.length} ${us.length===1?'usuário':'usuários'} neste navegador`)}<div class="tw"><table><thead><tr><th>Nome de usuário</th><th>Perfil</th><th></th></tr></thead><tbody>${us.map(u=>`<tr><td>${esc(u.name)}${u.email===user.email?' <span class="tag">você</span>':''}</td><td><select data-r="${esc(u.email)}" style="width:auto" aria-label="Perfil de ${esc(u.name)}">${opts(ROLES,u.role)}</select></td><td class="act">${u.email===user.email?'':`<button class="btn i d" data-ux="${esc(u.email)}" aria-label="Remover">${ic('tr')}</button>`}</td></tr>`).join('')}</tbody></table></div><p class="hint">O acesso é só pelo nome de usuário, sem senha: quem digitar um nome entra com o perfil dele. Um nome novo cria um usuário Operador. Os usuários ficam salvos apenas neste navegador.</p></div>`;
  $$('[data-r]',m).forEach(s=>s.onchange=()=>{const a=users(),u=a.find(x=>x.email===s.dataset.r);if(u.role==='Administrador'&&s.value!=='Administrador'&&a.filter(x=>x.role==='Administrador').length<2){toast('Mantenha ao menos um administrador');return VIEWS.usr(m)}
    act('Alterou perfil',u.name,`${u.role} → ${s.value}`);u.role=s.value;ls.set('bs.users',a);if(u.email===user.email){user.role=s.value;ls.set('bs.sess',user)}save();render();toast('Perfil atualizado','ok')});
  $$('[data-ux]',m).forEach(b=>b.onclick=async()=>{const a=users(),u=a.find(x=>x.email===b.dataset.ux);if(u.role==='Administrador'&&a.filter(x=>x.role==='Administrador').length<2)return toast('Mantenha ao menos um administrador');if(!await askDel(`Remover o usuário ${u.name}?`,'Remover'))return;ls.set('bs.users',a.filter(x=>x!==u));act('Removeu usuário',u.name,'');save();VIEWS.usr(m);toast('Usuário removido','ok')})};
VIEWS.cfg=m=>{const th=document.documentElement.dataset.theme||'dark',sn=ls.get('bs2.snaps',[]);
  m.innerHTML=`<div class="pg">${head('Configurações','Aparência, alertas e backup.')}<div class="set">
<div class="panel"><h3>Aparência</h3><div class="opt"><button class="btn ${th==='dark'?'on':''}" data-th="dark">${ic('moon')}Escuro</button><button class="btn ${th==='light'?'on':''}" data-th="light">${ic('sun')}Claro</button></div></div>
<div class="panel"><h3>Alertas de estoque</h3><div class="rowf"><span>Avisar quando uma categoria tiver até</span><span><input id="lm" type="number" min="0" value="${lowLim()}" style="width:80px" aria-label="Limite de estoque baixo"> unidades</span></div></div>
<div class="panel"><h3>Backup</h3><div class="opt"><button class="btn p" id="bk">${ic('dn')}Baixar backup</button><button class="btn" id="rs">${ic('up')}Restaurar de arquivo</button><input type="file" id="rf" accept=".json" class="hide"></div>
<h4 class="fh">Cópias automáticas (uma por dia, neste navegador)</h4>${sn.map((s,k)=>`<div class="rowf"><span>${fdt(s.t)} · ${s.d.items.length} itens${s.d.cmp?' · '+s.d.cmp.length+' máquinas':''}</span><button class="btn" data-sn="${k}">Restaurar</button></div>`).join('')||'<div class="empty sm">Nenhuma cópia ainda.</div>'}
<p class="hint">O backup inclui peças, máquinas, periféricos, patrimônio, empréstimos, manutenções, histórico e lixeira. Os arquivos anexados ficam no armazenamento do navegador e não entram no backup.</p></div>
<div class="panel"><h3>Dados</h3><div class="rowf"><span>Voltar ao inventário original de peças (apaga movimentações e atividades)</span><button class="btn d" id="rz">Restaurar original</button></div><p class="hint">${CLOUD_CFG?'Os dados ficam salvos no banco de dados (Supabase, acessado pela API do sistema) e são compartilhados com toda a equipe. Mesmo assim, baixe um backup de vez em quando.':'Os dados ficam salvos apenas neste navegador. Baixe um backup com frequência e guarde o arquivo em local seguro.'}</p></div></div></div>`;
  $$('[data-th]',m).forEach(b=>b.onclick=()=>{theme(b.dataset.th);VIEWS.cfg(m)});
  $('#lm').onchange=e=>{ls.set('bs2.low',Math.max(0,Math.floor(+e.target.value)||0));refreshBar();toast('Limite atualizado','ok')};
  $('#bk').onclick=()=>{const b=new Blob([JSON.stringify({v:5,t:Date.now(),items,movs,per,cmp,acts,assets,loans,maint,trash,hw})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='spbim-backup-'+tdy()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);ls.set('bs5.lastbk',Date.now());toast('Backup baixado','ok')};
  $('#rs').onclick=()=>$('#rf').click();
  $('#rf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=JSON.parse(await f.text());if(!await askDel('Substituir todos os dados atuais pelo conteúdo deste backup?','Substituir'))return;applyData(d);act('Restaurou backup',f.name);save();render();toast('Backup restaurado','ok')}catch(x){toast('Arquivo de backup inválido')}};
  $$('[data-sn]',m).forEach(b=>b.onclick=async()=>{const s=sn[+b.dataset.sn];if(!await askDel('Restaurar a cópia de '+fdt(s.t)+'? Os dados atuais serão substituídos.','Restaurar'))return;try{applyData(clone(s.d));act('Restaurou cópia automática',fdt(s.t));save();render();toast('Cópia restaurada','ok')}catch(x){toast('Não foi possível restaurar')}});
  $('#rz').onclick=async()=>{if(!await askDel('Voltar ao inventário original? Movimentações e atividades serão apagadas.','Restaurar original'))return;items=clone(SEED);movs=[];acts=[];save();render();toast('Inventário original restaurado','ok',UNDO)}};
const tName=t=>{const d=t.d;return t.k==='items'?d.name+' · '+d.cat:t.k==='cmp'||t.k==='hw'?d.nome:t.k==='per'?d.m:t.k==='assets'?d.code+' · '+d.name:t.k==='loans'?aC(d.aid)+' → '+d.who:aC(d.aid)+' · '+(d.prob||'').slice(0,40)};
VIEWS.trash=m=>{m.innerHTML=`<div class="pg">${head('Lixeira e desfazer','Recupere registros excluídos e reverta alterações.',`<button class="btn" id="tlg">${ic('hist')}Registro de alterações</button><button class="btn p" id="tud" ${undoS.length?'':'disabled'}>${ic('undo')}Desfazer última</button>`)}
<div class="panel" style="margin-bottom:14px"><h3>Alterações que podem ser desfeitas</h3>${undoS.slice(-8).reverse().map((u,k)=>`<div class="mv"><div>${esc(u.l)}<small>${k?'':'Próxima a ser desfeita · '}${fdt(u.t)}</small></div></div>`).join('')||'<div class="empty sm">Nada para desfazer nesta sessão.</div>'}<p class="hint">Desfazer restaura o estado anterior, inclusive itens excluídos e movimentações (atalho Ctrl+Z). Esta lista vale enquanto a página estiver aberta; o registro de alterações é permanente.</p></div>
<div class="panel"><h3 style="display:flex;justify-content:space-between">Lixeira <button class="lnk" id="tem">Esvaziar</button></h3><div class="tw"><table><thead><tr><th>Tipo</th><th>Registro</th><th>Excluído em</th><th>Por</th><th></th></tr></thead><tbody>${trash.map((t,i)=>`<tr><td>${K[t.k]}</td><td>${esc(tName(t))}</td><td>${fdt(t.t)}</td><td>${esc(t.u)}</td><td class="act"><button class="btn" data-tr="${i}">Restaurar</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">A lixeira está vazia.</td></tr>'}</tbody></table></div></div></div>`;
  $('#tud').onclick=doUndo;$('#tlg').onclick=()=>{movTab='act';go2('mov')};
  $('#tem').onclick=async()=>{if(!trash.length)return;if(await askDel('Apagar definitivamente tudo da lixeira? Isso não pode ser desfeito.','Esvaziar')){trash=[];ls.set('bs3.trash',trash);VIEWS.trash(m);toast('Lixeira esvaziada','ok')}};
  $$('[data-tr]',m).forEach(b=>b.onclick=()=>{const i=+b.dataset.tr,t=trash[i],C=COL();if(t.k==='assets'&&C.assets.some(a=>a.code===t.d.code))t.d.code=nextCodes(t.d.cat,1)[0];C[t.k].push(t.d);trash.splice(i,1);act('Restaurou da lixeira',tName(t),K[t.k],t.d.id);save();render();toast('Registro restaurado','ok')})};

/* =====================================================================
   EVENTOS GLOBAIS
   ===================================================================== */
function initUI(){
  $$('.lm').forEach(i=>i.src=LOGO);
  $('#out').innerHTML=ic('out')+'<span>Sair</span>';$('#tg').innerHTML=ic('menu')+'<span>Menu</span>';$('#mb').innerHTML=ic('menu');
  $('#tb2').innerHTML=`<button class="btn i" id="und" aria-label="Desfazer" title="Desfazer (Ctrl+Z)">${ic('undo')}</button><button class="btn" id="srch" title="Busca geral">${ic('search')}<span>Buscar</span><kbd>Ctrl K</kbd></button><button class="btn i" id="thm" aria-label="Alternar tema"></button><button class="btn i" id="bell" aria-label="Notificações">${ic('bell')}<b id="bd" class="hide"></b></button>`;
  theme(document.documentElement.dataset.theme||'dark');
  $('#nav').onclick=e=>{const b=e.target.closest('[data-v]');if(b)go2(b.dataset.v)};
  $('#gt').onclick=e=>{const b=e.target.closest('[data-gt]');if(b)go2(b.dataset.gt)};
  $('#mn').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go2(b.dataset.go)});
  $('#out').onclick=logout;
  const tgl=()=>{const A=$('#app');if(matchMedia('(max-width:860px)').matches)A.classList.toggle('open');else{A.classList.toggle('col');try{localStorage.setItem('bs.col',A.classList.contains('col')?'1':'')}catch(e){}}};
  $('#tg').onclick=tgl;$('#mb').onclick=tgl;$('#ov').onclick=()=>$('#app').classList.remove('open');
  $('#und').onclick=doUndo;$('#srch').onclick=pal;$('#thm').onclick=()=>theme(document.documentElement.dataset.theme==='light'?'dark':'light');
  $('#bell').onclick=e=>{e.stopPropagation();const p=$('#np');if(p.classList.contains('hide')){bellDraw();p.classList.remove('hide')}else p.classList.add('hide')};
  $('#np').onclick=e=>{const b=e.target.closest('[data-go]');if(b){$('#np').classList.add('hide');go2(b.dataset.go)}};
  document.addEventListener('click',e=>{const p=$('#np');if(!p.classList.contains('hide')&&!p.contains(e.target))p.classList.add('hide')});
  $('#dlg').addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeDlg()});
  $('#av').onclick=()=>$('#avf').click();
  $('#avf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f||!user)return;const u=URL.createObjectURL(f),im=new Image();
    im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,96,96);URL.revokeObjectURL(u);ls.set('bs.av.'+user.email,c.toDataURL('image/jpeg',.85));avatar();toast('Foto atualizada','ok')};
    im.onerror=()=>{URL.revokeObjectURL(u);toast('Imagem inválida')};im.src=u};
  $('#xq').oninput=e=>palRes(e.target.value);
  $('#xq').onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();palS=Math.min(palI.length-1,palS+1);palDraw()}else if(e.key==='ArrowUp'){e.preventDefault();palS=Math.max(0,palS-1);palDraw()}else if(e.key==='Enter'){e.preventDefault();palGo(palS)}};
  $('#xr').onclick=e=>{const p=e.target.closest('.pi');if(p)palGo(+p.dataset.k)};
  document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
    if(e.key==='Escape'){$('#app').classList.remove('open');$('#np').classList.add('hide')}
    if(!user)return;
    if(mod&&k==='k'){e.preventDefault();pal()}
    else if(mod&&!e.shiftKey&&k==='z'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!document.querySelector('dialog[open]')){e.preventDefault();doUndo()}});
  window.addEventListener('hashchange',deepLink);
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&camS&&view!=='chk')kStop()});
}

/* =====================================================================
   INICIALIZAÇÃO
   ===================================================================== */
(function migrate(){let ch=false;
  /* máquinas refeitas a partir da planilha INVENTARIO (aba Máquinas), uma única vez:
     as máquinas antigas (que tinham duplicatas vindas das especificações) são guardadas
     em bs6.cmpOld e substituídas pela lista nova */
  if(!ls.get('bs6.mach',0)&&MACH.length){if(cmp.length)ls.set('bs6.cmpOld',cmp);const t=Date.now();
    cmp=MACH.map((d,i)=>({id:'cm'+(t+i),created:t,obs:'',...d,sto:stoOf(d)}));
    ls.set('bs6.mach',1);ls.set('bs4.mach',1);ls.set('bs5.specs',1);ch=true}
  if(ch){ls.set('bs2.cmp',cmp)}})();
$('#hm').textContent=items.length;$('#hp').textContent=total();
lastS=ser();lastD=JSON.parse(lastS);lastA=acts[0]?acts[0].t:0;
initUI();
document.addEventListener('visibilitychange',()=>{if(!cloud.on)return;if(document.hidden){if(Object.keys(cloud.pend).length)cloudPush()}else cloudPoll()});
(function boot(){
  if(CLOUD_CFG){api('session').then(cloudStart).catch(()=>authUI());return}
  const u=user&&users().find(x=>x.email===user.email);if(u)enter(u);else authUI()})();
</script>
